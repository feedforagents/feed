name: Deploy Cloudflare

on:
  workflow_run:
    workflows: [CI - Tests, Cloudflare compatibility]
    types: [completed]
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment branch and Cloudflare environment
        type: choice
        options: [staging, production]
        required: true
      expected_sha:
        description: Optional full commit selected by the CI completion dispatcher
        type: string
        required: false

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: cloudflare-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Select tested branch head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.event.workflow_run.head_branch || inputs.environment }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in staging|production) ;; *) exit 1 ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != "$TARGET" ]; then
            echo "Select the matching workflow branch and environment."
            exit 1
          fi
          sha=$(gh api "repos/$REPOSITORY/git/ref/heads/$TARGET" --jq .object.sha)
          if [ -n "$RUN_SHA" ] && [ "$sha" != "$RUN_SHA" ]; then
            echo 'A newer commit exists; refuse to deploy the stale CI run.'
            exit 1
          fi
          gh api "repos/$REPOSITORY/commits/$sha/check-runs?per_page=100" > /tmp/checks.json
          python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/checks.json'))['check_runs']
          for name in ['Quality Gate', 'Run All Tests', 'Cloudflare build']:
              matches=[r for r in runs if r['name']==name and r['app']['slug']=='github-actions']
              if not matches or max(matches,key=lambda r:r['id'])['conclusion'] != 'success':
                  raise SystemExit(f'{name} must pass on the selected commit')
          PY
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: select
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch deployment on the protected target branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ needs.select.outputs.environment }}
          SHA: ${{ needs.select.outputs.sha }}
        run: |
          gh workflow run cloudflare.yml --repo "$REPOSITORY" --ref "$TARGET" \
            -f environment="$TARGET" -f expected_sha="$SHA"

  deploy:
    needs: select
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-${{ needs.select.outputs.environment }}
    # Keep staging preparation and upload under the same database lease as the
    # existing manual migration workflows. Production keeps its existing flow.
    concurrency:
      group: ${{ needs.select.outputs.environment == 'staging' && 'database-migrations-staging' || format('cloudflare-production-deploy-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_RUNTIME_SECRETS: ${{ secrets.CLOUDFLARE_RUNTIME_SECRETS }}
      CLOUDFLARE_BUILD_ENV: ${{ secrets.CLOUDFLARE_BUILD_ENV }}
      TARGET: ${{ needs.select.outputs.environment }}
      COMMIT_SHA: ${{ needs.select.outputs.sha }}
      NEXT_PUBLIC_STEWARD_TENANT_ID: ${{ vars.NEXT_PUBLIC_STEWARD_TENANT_ID }}
      NEXT_PUBLIC_STEWARD_API_URL: ${{ vars.NEXT_PUBLIC_STEWARD_API_URL }}
      NEXT_PUBLIC_POSTHOG_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_ID }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.CLOUDFLARE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Require configured environment
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_RUNTIME_SECRETS"
          test -n "$NEXT_PUBLIC_STEWARD_API_URL"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:cloudflare
      - run: bun run build:cloudflare "$TARGET"
      - name: Prepare staging fee schema before upload
        if: needs.select.outputs.environment == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: bun scripts/cloudflare/prepare-staging-fee-schema.ts
      - name: Ensure isolated Cloudflare resources exist
        run: bun scripts/cloudflare/provision.ts "$TARGET"
      - name: Deploy app and scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SURPLUS_API_KEY: ${{ secrets.SURPLUS_API_KEY }}
        run: bun scripts/cloudflare/deploy.ts "$TARGET"
