name: deploy

on:
  push:
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare Workers target environment
        type: choice
        options: [staging, production]
        required: true
      dry_run:
        description: Plan and validate without mutating Cloudflare resources
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  TURBO_TELEMETRY_DISABLED: "1"
  ALCHEMY_FAST_DISTILLED: "1"

jobs:
  deploy:
    name: Deploy feed.fun (${{ inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'staging') }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-${{ inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'staging') }}
    env:
      TARGET_ENV: ${{ inputs.environment || (github.ref == 'refs/heads/production' && 'production' || 'staging') }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN != '' && 'local:rw,remote:rw' || 'local:rw' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_RUNTIME_SECRETS: ${{ secrets.CLOUDFLARE_RUNTIME_SECRETS }}
      ALCHEMY_STATE_STORE: ${{ vars.ALCHEMY_STATE_STORE || '' }}
      R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET || '' }}
      R2_STATE_PREFIX: ${{ vars.R2_STATE_PREFIX || '' }}
      R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SURPLUS_API_KEY: ${{ secrets.SURPLUS_API_KEY }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      PROD_DIRECT_DATABASE_URL: ${{ secrets.PROD_DIRECT_DATABASE_URL }}
      STAGING_DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          job: deploy-${{ env.TARGET_ENV }}
          verification: "false"
      - name: Build @repo/app (SPA + Worker) via Turborepo
        run: pnpm exec turbo run build --filter=@repo/app... --filter='!//' --filter='!@elizaos/*'
      - name: Verify compiled Worker in offline workerd
        run: pnpm --filter @repo/app test:deploy
      - name: Restore Alchemy local state cache
        if: vars.ALCHEMY_STATE_STORE != 'cloudflare' && vars.R2_STATE_BUCKET == ''
        uses: actions/cache/restore@v6
        with:
          path: .alchemy/state
          key: alchemy-state-feed-${{ env.TARGET_ENV }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            alchemy-state-feed-${{ env.TARGET_ENV }}-
      - name: Preflight Cloudflare auth and run Alchemy plan (dry-run)
        if: env.DRY_RUN == 'true'
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            pnpm exec alchemy --fast-distilled provider check-env
            pnpm exec alchemy --fast-distilled plan --stage "$TARGET_ENV" --no-input
          else
            echo "::notice::Skipping live Cloudflare Alchemy plan in dry-run because CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not configured (offline workerd verification already passed)."
          fi
      - name: Migrate and seed PostgreSQL database
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/database-ca.pem"' EXIT
          if [[ "$TARGET_ENV" == "production" ]]; then
            RAW_DB_URL="$PROD_DIRECT_DATABASE_URL"
          else
            RAW_DB_URL="$STAGING_DIRECT_DATABASE_URL"
          fi
          if [[ -z "$RAW_DB_URL" ]]; then
            echo "::error::Direct database URL secret is not set for cloudflare-${TARGET_ENV}"
            exit 1
          fi
          if [[ -n "$DATABASE_CA_CERT" ]]; then
            printf '%s\n' "$DATABASE_CA_CERT" > "$RUNNER_TEMP/database-ca.pem"
            chmod 600 "$RUNNER_TEMP/database-ca.pem"
          fi
          export TARGET_DIRECT_DATABASE_URL="${RAW_DB_URL//\$RUNNER_TEMP/$RUNNER_TEMP}"
          pnpm --filter @repo/app exec node --import vibelang/register --input-type=module -e '
            import { Effect } from "effect";
            import { migrateFeedSchema, seedFeedWorld, Store, toInt, workerDbStore } from "@repo/db/worker";

            const url = process.env.TARGET_DIRECT_DATABASE_URL;
            if (!url) throw new Error("TARGET_DIRECT_DATABASE_URL is required");
            const program = Effect.gen(function* () {
              yield* migrateFeedSchema();
              yield* seedFeedWorld();
              const store = yield* Store;
              return yield* store.transaction((tx) =>
                Effect.gen(function* () {
                  const counts = {};
                  for (const table of [
                    "feed_actors",
                    "feed_organizations",
                    "feed_prediction_markets",
                    "feed_spot_pools",
                    "feed_perp_markets",
                    "feed_posts",
                    "feed_articles",
                    "feed_world_facts"
                  ]) {
                    const rows = yield* tx.query(`SELECT count(*) AS count FROM ${table}`);
                    counts[table] = toInt(rows[0]?.count);
                  }
                  const ticks = yield* tx.query(
                    "SELECT job_name, last_status, last_error, last_run_at FROM feed_tick_health ORDER BY job_name ASC"
                  );
                  return { counts, ticks };
                })
              );
            });
            const { counts, ticks } = await Effect.runPromise(Effect.provide(program, workerDbStore(url)));
            console.log("Database migrated and seeded:", JSON.stringify(counts));
            console.log("Current feed_tick_health:", JSON.stringify(ticks));
            if (counts.feed_actors < 1 || counts.feed_prediction_markets < 1 || counts.feed_perp_markets < 1) {
              throw new Error("Seed verification failed: expected non-empty core world tables");
            }
          '
      - name: Deploy Worker, R2, Hyperdrive, Email, Crons & Domains via Alchemy
        id: alchemy-deploy
        if: env.DRY_RUN != 'true'
        env:
          ALCHEMY_SKIP_LIVE_VERIFY: "1"
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in environment cloudflare-${TARGET_ENV}"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"
            exit 1
          fi
          pnpm exec alchemy --fast-distilled provider check-env
          pnpm exec alchemy --fast-distilled deploy --stage "$TARGET_ENV" --adopt --yes --no-input
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Save Alchemy local state cache
        if: >-
          steps.alchemy-deploy.outputs.deployed == 'true' &&
          vars.ALCHEMY_STATE_STORE != 'cloudflare' &&
          vars.R2_STATE_BUCKET == ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .alchemy/state
          key: alchemy-state-feed-${{ env.TARGET_ENV }}-${{ github.sha }}-${{ github.run_attempt }}
      - name: Verify live deployment endpoints via @repo/cli
        if: env.DRY_RUN != 'true'
        run: pnpm cli verify-live --stage "$TARGET_ENV" --commit "$GITHUB_SHA" --json
