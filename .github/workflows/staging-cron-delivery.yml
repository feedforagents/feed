name: Read staging cron delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-cron-delivery:
    if: github.repository == 'feedforagents/feed' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Read the hosted schedule
        id: schedule
        run: |
          paths=$(bun --no-env-file -e 'import { jobs } from "./workers/cron/src/schedule.ts"; console.log(JSON.stringify(jobs.map(({ path }) => path)))')
          printf 'paths=%s\n' "$paths" >> "$GITHUB_OUTPUT"
      - name: Read allowlisted cron events for 145 seconds
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CRON_PATHS: ${{ steps.schedule.outputs.paths }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_WRITE_LOGS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo '::error::The cloudflare-staging account or credential is unavailable.' >&2
            exit 1
          fi

          # Strip both raw output streams before they can reach the Actions log.
          set +e
          timeout --kill-after=5s 145s ./node_modules/.bin/wrangler tail feed-cron-staging \
            --config workers/cron/wrangler.staging.jsonc --format json --search cron_delivery 2>/dev/null |
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            jq --compact-output --unbuffered --argjson paths "$CRON_PATHS" '
              def uint:
                if type == "number" then
                  isfinite and . >= 0 and . <= 9007199254740991 and . == floor
                else false end;
              objects | .logs? | arrays | .[] | objects | .message? | arrays | .[]
              | if type == "string" then fromjson? else . end
              | objects
              | select(keys == ["attempt", "event", "finishedAt", "httpStatus", "job", "outcome", "scheduledTime", "startedAt"])
              | select(.event == "cron_delivery")
              | .job as $job
              | select(($paths | index($job)) != null)
              | select((.scheduledTime | uint) and (.startedAt | uint) and (.finishedAt | uint))
              | select(.attempt | uint and . > 0)
              | select(.httpStatus | . == null or (uint and . >= 100 and . <= 599))
              | select(.outcome == "completed" or .outcome == "skipped" or .outcome == "failed" or .outcome == "unknown")
              | {event, job, scheduledTime, startedAt, finishedAt, attempt, httpStatus, outcome}
            ' 2>/dev/null
          status=("${PIPESTATUS[@]}")
          set -e

          if (( status[1] != 0 )); then
            echo '::error::The staging tail did not produce a parseable JSON stream.' >&2
            exit 1
          fi
          case "${status[0]}" in
            124) ;;
            0) echo '::error::The staging tail closed before the observation window elapsed.' >&2; exit 1 ;;
            137) echo '::error::The staging tail did not shut down within the timeout.' >&2; exit 1 ;;
            *) echo '::error::The staging tail failed. Verify the environment credential has Workers tail access to feed-cron-staging.' >&2; exit 1 ;;
          esac
