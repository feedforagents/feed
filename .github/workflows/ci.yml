name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, staging, production]
  push:
    branches: [develop, staging, production]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  vibestack-precompute-simulations:
    name: simulate-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          job: simulate-${{ matrix.shard }}
          eliza-build: "false"
      - name: Simulate the specs assigned to this shard
        id: precompute
        run: node vibestack/spec.ts ci precompute-simulations --shard ${{ matrix.shard }} --shards 4
      - if: always() && steps.precompute.outputs.directory != ''
        uses: actions/upload-artifact@v7
        with:
          name: simulations-${{ matrix.shard }}
          path: ${{ steps.precompute.outputs.directory }}
          compression-level: 0
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1

  verify:
    name: verify
    needs: vibestack-precompute-simulations
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN != '' && (github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r') || 'local:rw' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: setup
        uses: ./.github/actions/setup
        with:
          job: verify
      - name: Build design tokens and Storybook stories
        run: |
          pnpm --filter @repo/design-system build
          pnpm --filter @repo/ui gen
      - id: simulations
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: simulations-*
          path: ${{ runner.temp }}/simulation-receipts
      - id: import-simulations
        if: steps.simulations.outcome == 'success'
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const source = path.join(process.env.RUNNER_TEMP, "simulation-receipts");
          const cache = ".spec-cache";
          const candidates = fs.globSync(["*", "simulations-*/*"], { cwd: source })
            .filter((file) => /^(?:simulations-\d+\/)?(?:action|simulate)-[a-f0-9]{24}\.json\.(?:zst|gz)$/.test(file) && fs.lstatSync(path.join(source, file)).isFile());
          fs.mkdirSync(cache, { recursive: true });
          let imported = 0;
          for (const [key, files] of Map.groupBy(candidates, (file) => path.basename(file, path.extname(file)))) {
            if (["zst", "gz"].some((codec) => fs.lstatSync(path.join(cache, `${key}.${codec}`), { throwIfNoEntry: false }))) continue;
            const name = path.basename(files[0]);
            const bytes = fs.readFileSync(path.join(source, files[0]));
            fs.writeFileSync(path.join(cache, name), bytes, { flag: "wx" });
            imported++;
          }
          console.log(`Imported ${imported} simulation receipts.`);
          JS
      - id: verify-tasks
        run: node vibestack/spec.ts tasks build typecheck test test:browser check //#lint:js //#lint:css //#analyze --filter='!@elizaos/*' --continue=dependencies-successful --summarize --log-order=stream
      - name: Verify Cloudflare Worker in offline workerd
        env:
          ALCHEMY_FAST_DISTILLED: "1"
        run: pnpm --filter @repo/app test:deploy
      - if: always() && steps.setup.outputs.spec-cache-key != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.spec-cache-path }}
          key: ${{ steps.setup.outputs.spec-cache-key }}
      - if: always() && steps.setup.outputs.turbo-cache-key != ''
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures-verify
          path: |
            test/counterexamples/
            test/__traces__/
            apps/*/test/counterexamples/
            apps/*/test/__traces__/
            packages/*/test/counterexamples/
            packages/*/test/__traces__/
            apps/*/.cache/vitest/attachments/
            packages/*/.cache/vitest/attachments/
          if-no-files-found: ignore
          include-hidden-files: true
