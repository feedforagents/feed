name: ci

on:
  pull_request:
    branches: [vibestack, staging, main]
  push:
    branches: [vibestack, staging, main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  vibestack-precompute-simulations:
    name: simulate-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          job: simulate-${{ matrix.shard }}
      - name: Simulate the specs whose files hash to this shard
        id: precompute
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          node --input-type=module <<'JS'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { prepareSimulationReceipts, readSpecs } from "./vibestack/formal.ts";
          const simulations = () => fs.existsSync(".spec-cache") ? fs.readdirSync(".spec-cache").filter((name) => name.startsWith("simulate-")) : [];
          const restored = new Set(simulations());
          const specs = readSpecs(process.cwd());
          const inShard = ({ file }) => parseInt(createHash("sha256").update(file).digest("hex").slice(0, 8), 16) % Number(process.env.SHARDS) === Number(process.env.SHARD) - 1;
          const names = specs.filter(inShard).map(({ name }) => name);
          const { results, seedDirectory } = await prepareSimulationReceipts(process.cwd(), specs, names, process.env.RUNNER_TEMP);
          const transfer = seedDirectory ?? fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "simulation-delta-"));
          if (!seedDirectory) for (const name of simulations().filter((file) => !restored.has(file))) {
            fs.copyFileSync(path.join(".spec-cache", name), path.join(transfer, name));
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${transfer}\n`);
          const failed = results.filter(({ ok }) => !ok);
          for (const { stage, summary, detail, where } of failed) console.log(`✗ ${stage} ${where ?? ""}: ${summary}\n${detail}`);
          console.log(`shard ${process.env.SHARD} of ${process.env.SHARDS}: ${names.length} specs, ${results.length} results, ${fs.readdirSync(transfer).length} ${seedDirectory ? "complete seed" : "new aggregate"} entries, ${failed.length} failed`);
          process.exitCode = failed.length ? 1 : 0;
          JS
      - if: always() && steps.precompute.outputs.directory != ''
        uses: actions/upload-artifact@v7
        with:
          name: simulations-${{ matrix.shard }}
          path: ${{ steps.precompute.outputs.directory }}
          compression-level: 0
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1

  verify:
    name: verify
    needs: vibestack-precompute-simulations
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'turbo-cache-publish' || 'turbo-cache-read' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_CACHE: ${{ secrets.TURBO_TOKEN != '' && (github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r') || 'local:rw' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: setup
        uses: ./.github/actions/setup
        with:
          job: verify
      - name: Build design tokens and Storybook stories
        run: |
          pnpm --filter @repo/design-system build
          pnpm gen
          pnpm --filter @repo/ui gen
      - id: simulations
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: simulations-*
          path: ${{ runner.temp }}/simulation-receipts
      - id: import-simulations
        if: steps.simulations.outcome == 'success'
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const source = path.join(process.env.RUNNER_TEMP, "simulation-receipts");
          const cache = ".spec-cache";
          const candidates = fs.globSync(["*", "simulations-*/*"], { cwd: source })
            .filter((file) => /^(?:simulations-\d+\/)?(?:action|simulate)-[a-f0-9]{24}\.json\.(?:zst|gz)$/.test(file) && fs.lstatSync(path.join(source, file)).isFile());
          fs.mkdirSync(cache, { recursive: true });
          let imported = 0;
          for (const [key, files] of Map.groupBy(candidates, (file) => path.basename(file, path.extname(file)))) {
            if (["zst", "gz"].some((codec) => fs.lstatSync(path.join(cache, `${key}.${codec}`), { throwIfNoEntry: false }))) continue;
            const name = path.basename(files[0]);
            const bytes = fs.readFileSync(path.join(source, files[0]));
            fs.writeFileSync(path.join(cache, name), bytes, { flag: "wx" });
            imported++;
          }
          console.log(`Imported ${imported} simulation receipts.`);
          JS
      - id: verify-tasks
        run: node vibestack/spec.ts tasks build typecheck test test:browser check //#lint:js //#lint:css //#analyze --filter='!@elizaos/*' --continue=dependencies-successful --summarize --log-order=stream
      - name: Verify Cloudflare Worker dry-run bundle
        run: pnpm --filter @repo/app exec wrangler deploy --config wrangler.production.jsonc --dry-run
      - if: always() && steps.setup.outputs.spec-cache-key != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.spec-cache-path }}
          key: ${{ steps.setup.outputs.spec-cache-key }}
      - if: always() && steps.setup.outputs.turbo-cache-key != ''
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures-verify
          path: |
            test/counterexamples/
            test/__traces__/
            apps/*/test/counterexamples/
            apps/*/test/__traces__/
            packages/*/test/counterexamples/
            packages/*/test/__traces__/
            apps/*/.cache/vitest/attachments/
            packages/*/.cache/vitest/attachments/
          if-no-files-found: ignore
          include-hidden-files: true
